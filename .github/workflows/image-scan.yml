name: image-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No private registry yet: the build secret is a decoy that must not reach the image.
      - name: Build-time registry token
        run: printf 'ci-dummy-token-%s' "$GITHUB_RUN_ID" > .npm_token

      - name: Build production image
        run: npm run image:build

      - name: Secret leak check
        run: |
          npm run demo:image | tee image.txt
          awk -F= '/^token-in-/{t+=$2} END{exit t}' image.txt

      - name: Vulnerability gate
        env:
          SCAN_MAX: '20'
        run: npm run scan
