include:
  - observability/compose.yaml

# Dev-only values for a local stack. Real environments take them from
# Infisical (scripts/with-secrets.sh) or a K8s Secret; nothing here is reused there.
x-app-image: &app-image
  image: marketplace-api:local
  build:
    context: .
    dockerfile: docker/Dockerfile

x-app-env: &app-env
  DB_HOST: pgbouncer
  DB_PORT: '6432'
  DB_USER: app_user
  DB_PASSWORD: ${APP_DB_PASSWORD:-app-secret-initial}
  DB_NAME: shop
  DB_URL: postgresql://app_user:${APP_DB_PASSWORD:-app-secret-initial}@pgbouncer:6432/shop
  BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-app}:${RABBITMQ_DEFAULT_PASS:-app}@rabbitmq:5672
  REDIS_URL: redis://redis-cache:6379
  REDIS_QUEUE_URL: redis://redis-queue:6379
  PORT: '3000'
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_SERVICE_NAME: marketplace-api
  STORAGE_ENDPOINT: http://minio:9000
  STORAGE_REGION: us-east-1
  STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-hw26user}
  STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hw26secretpass}
  STORAGE_BUCKET: hw26-files
  CONFIG_ENV_FILE: /keys/jwt.env

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin-secret}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-shop}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U admin']
      interval: 5s
      timeout: 5s
      retries: 10
  pact-broker:
    image: pactfoundation/pact-broker:2.126.0-pactbroker2.113.0
    ports:
      - '9292:9292'
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: /tmp/pactbroker.sqlite
      PACT_BROKER_BASE_URL: http://127.0.0.1:9292
      PACT_BROKER_LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  rabbitmq:
    image: rabbitmq:4.2-management
    # The data dir is named after the node, so the hostname must not change between runs.
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-app}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
  redis-cache:
    image: redis:8-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  redis-queue:
    image: redis:8-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    volumes:
      - redis-queue-data:/data
    ports:
      - '16380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    # official minio/minio images are no longer public; pgsty/minio is a drop-in community build
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hw26user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hw26secretpass}
    ports:
      - '19000:9000'
      - '19001:9001'
    volumes:
      # tmpfs: every `down` leaves a clean slate; below ~1g MinIO dies mid-series
      - type: tmpfs
        target: /data
        tmpfs:
          size: 1073741824
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
  keygen:
    image: node:22-alpine
    # First start only: tokens must keep verifying after `docker compose restart`.
    command:
      - sh
      - -c
      - >-
        [ -s /keys/jwt.env ] || {
        node /scripts/jwt-keygen.mjs compose-dev > /keys/jwt.env.tmp &&
        node -e "console.log('REFRESH_TOKEN_PEPPER=' + require('crypto').randomBytes(32).toString('hex'))" >> /keys/jwt.env.tmp &&
        mv /keys/jwt.env.tmp /keys/jwt.env; }
    volumes:
      - ./scripts/jwt-keygen.mjs:/scripts/jwt-keygen.mjs:ro
      - jwt-keys:/keys
  migrate:
    <<: *app-image
    # Straight to Postgres: DDL and CREATE INDEX CONCURRENTLY do not belong behind transaction pooling.
    command:
      [
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/database/data-source.js',
      ]
    environment:
      <<: *app-env
      DB_HOST: db
      DB_PORT: '5432'
    depends_on:
      db:
        condition: service_healthy
  seed:
    <<: *app-image
    command: ['dist/seed.js']
    environment:
      <<: *app-env
      DB_HOST: db
      DB_PORT: '5432'
      SEED_PASSWORD: ${SEED_PASSWORD:-marketplace-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    <<: *app-image
    environment:
      <<: *app-env
      MESSAGING_ENABLED: ${MESSAGING_ENABLED:-1}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - jwt-keys:/keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  worker:
    <<: *app-image
    command: ['dist/worker.js']
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: marketplace-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
volumes:
  pgdata:
  rabbitmq-data:
  redis-queue-data:
  jwt-keys:
