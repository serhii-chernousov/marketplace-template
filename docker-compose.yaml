services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin-secret}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-shop}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U admin']
      interval: 5s
      timeout: 5s
      retries: 10
  pact-broker:
    image: pactfoundation/pact-broker:2.126.0-pactbroker2.113.0
    ports:
      - '9292:9292'
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: /tmp/pactbroker.sqlite
      PACT_BROKER_BASE_URL: http://127.0.0.1:9292
      PACT_BROKER_LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
volumes:
  pgdata:
