services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin-secret}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-shop}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U admin']
      interval: 5s
      timeout: 5s
      retries: 10
  pact-broker:
    image: pactfoundation/pact-broker:2.126.0-pactbroker2.113.0
    ports:
      - '9292:9292'
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: /tmp/pactbroker.sqlite
      PACT_BROKER_BASE_URL: http://127.0.0.1:9292
      PACT_BROKER_LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  rabbitmq:
    image: rabbitmq:4.2-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-app}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
  redis-cache:
    image: redis:8-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  redis-queue:
    image: redis:8-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    ports:
      - '16380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    # official minio/minio images are no longer public; pgsty/minio is a drop-in community build
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hw26user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hw26secretpass}
    ports:
      - '19000:9000'
      - '19001:9001'
    volumes:
      # tmpfs: every `down` leaves a clean slate; below ~1g MinIO dies mid-series
      - type: tmpfs
        target: /data
        tmpfs:
          size: 1073741824
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  pgdata:
