openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: >
    Контракт Marketplace API (курсовий проєкт). Усе, що стосується конкретного
    користувача, вимагає Bearer access-токена (ES256 JWT, POST /auth/login);
    відкриті лише вхід, перегляд оголошень і карток товарів.
servers:
  - url: http://localhost:3000/v1
security: []
paths:
  /listings:
    get:
      operationId: listListings
      summary: Список активних оголошень
      description: Повертає лише active-оголошення з cursor-пагінацією.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Сторінка оголошень
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createListing
      security:
        - bearerAuth: []
      summary: Створити оголошення
      description: Доступно лише продавцю (роль seller). Повертає Location створеного ресурсу.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Оголошення створено
          headers:
            Location:
              description: URI створеного оголошення
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /listings/{id}:
    get:
      operationId: getListing
      summary: Отримати оголошення за id
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Оголошення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPublic'
        '404':
          description: Оголошення не знайдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://marketplace.local/problems/listing-not-found
                title: Listing not found
                status: 404
                detail: Listing with the given id does not exist
                instance: /v1/listings/unknown
    patch:
      operationId: updateListing
      security:
        - bearerAuth: []
      summary: Оновити власне оголошення
      description: Лише власник оголошення може змінювати його. Чужий продавець отримує 403.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListingRequest'
      responses:
        '200':
          description: Оновлене оголошення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Оголошення не знайдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders:
    get:
      operationId: listOrders
      security:
        - bearerAuth: []
      summary: Список замовлень
      description: >
        Для buyer — власні замовлення.
        Для seller — замовлення, що містять лоти цього продавця.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Сторінка замовлень
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createOrder
      security:
        - bearerAuth: []
      summary: Створити замовлення
      description: Створення замовлення покупцем. Потрібен Idempotency-Key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Ключ ідемпотентності створення. Той самий ключ і те саме тіло запиту
            повертають ту саму відповідь (повтор безпечний). Той самий ключ з іншим
            тілом — конфлікт семантики (422).
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Замовлення створено
          headers:
            Location:
              description: URI створеного замовлення
              schema:
                type: string
            Idempotency-Replay:
              description: true, якщо відповідь відтворена з кешу ідемпотентності
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          description: Оголошення з позиції замовлення не знайдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Недостатньо товару на складі
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://marketplace.local/problems/out-of-stock
                title: Out of stock
                status: 409
                detail: One or more listings do not have enough quantity
                instance: /v1/orders
        '422':
          description: Різні продавці в одному замовленні або конфлікт Idempotency-Key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://marketplace.local/problems/mixed-seller-order
                title: Mixed seller order
                status: 422
                detail: All order items must belong to the same seller
                instance: /v1/orders
  /orders/{id}:
    get:
      operationId: getOrder
      security:
        - bearerAuth: []
      summary: Отримати замовлення за id
      description: Доступно покупцю цього замовлення або продавцю лотів у ньому.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Замовлення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Замовлення не знайдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /products:
    post:
      operationId: createProduct
      security:
        - bearerAuth: []
      summary: Додати товар у каталог
      description: Лише seller або admin; покупець отримує 403. Власником стає автор запиту.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Товар створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Товар з такою назвою вже є
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /products/{id}:
    get:
      operationId: getProductCard
      summary: Картка товару з рейтингом і залишком
      description: Кешується в Redis (cache-aside, TTL з джитером).
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Картка товару
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Товар не знайдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sessions:
    post:
      operationId: createSession
      security:
        - bearerAuth: []
      summary: Відкрити сесію
      description: >
        Сесія для користувача з access-токена. Живе в Redis і подовжується на
        кожному запиті з X-Session-Id.
      responses:
        '201':
          description: Сесію створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sessions/me:
    get:
      operationId: getCurrentSession
      summary: Поточна сесія
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Сесія активна, TTL щойно подовжено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteCurrentSession
      summary: Закрити сесію
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Сесію видалено
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/login:
    post:
      operationId: login
      summary: Вхід за email і паролем
      description: Видає нову сімʼю токенів — короткий access (JWT) і довгий непрозорий refresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пара токенів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Ротація refresh-токена
      description: >
        Кожен refresh одноразовий: успіх видає нову пару й гасить стару. Повторне
        предʼявлення вже використаного токена — сигнал компрометації: відкликається
        вся сімʼя, і обидві сторони отримують 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Нова пара токенів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      security:
        - bearerAuth: []
      summary: Вихід
      description: Відкликає сімʼю refresh-токенів і кладе jti access-токена в денилист.
      responses:
        '204':
          description: Сесію завершено
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      operationId: getMe
      security:
        - bearerAuth: []
      summary: Поточний користувач
      responses:
        '200':
          description: Власник access-токена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /uploads/intent:
    post:
      operationId: createUploadIntent
      security:
        - bearerAuth: []
      summary: Намір завантажити файл
      description: >
        Сервер сам генерує ключ обʼєкта (uploads/{userId}/{uuid}.{ext}, розширення — з allowlist за
        content_type; filename у ключ не потрапляє), створює рядок PENDING і підписує URL. До порогу —
        один presigned PUT, понад поріг — multipart з підписаними URL на кожну частину. Байти йдуть
        у сховище напряму, повз API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadIntentRequest'
      responses:
        '200':
          description: Ключ і підписані URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /uploads/{id}/parts:
    get:
      operationId: getUploadParts
      security:
        - bearerAuth: []
      summary: Стан multipart-завантаження для довантаження
      description: >
        ListParts на боці сервера: які частини вже лежать у сховищі, і свіжі підписані URL лише на
        ті, яких бракує. Клієнт після обриву доливає тільки їх.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Завантажені й відсутні частини
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadParts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /uploads/{id}/commit:
    post:
      operationId: commitUpload
      security:
        - bearerAuth: []
      summary: Підтвердити завантаження
      description: >
        Для multipart — CompleteMultipartUpload за серверним ListParts. Далі завжди HeadObject:
        обʼєкта немає або розмір не збігається з заявленим — 409, і лише після звірки рядок стає
        COMPLETED. Повторний commit уже завершеного файла — 200.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Файл у сховищі й звірений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: X-Session-Id
      in: header
      required: true
      description: Ідентифікатор сесії з POST /sessions
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Максимальна кількість елементів на сторінці
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозорий токен пагінації з попередньої відповіді (next_cursor)
      schema:
        type: string
    ListingId:
      name: id
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{1,18}$'
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Немає, протух, відкликаний або зіпсований токен (чи сесія) — клієнт іде рефрешити або на вхід
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Перевищено ліміт запитів
      headers:
        Retry-After:
          description: Через скільки секунд можна повторити
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Невалідний запит
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Доступ заборонено
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Стан ресурсу не дозволяє операцію
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: URI типу помилки
        title:
          type: string
          description: Коротка назва помилки
        status:
          type: integer
          description: HTTP-код
        detail:
          type: string
          description: Що саме пішло не так
        instance:
          type: string
          description: Посилання на конкретний випадок
    ListingPublic:
      type: object
      required: [id, title, price_cents, status, seller_id]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        price_cents:
          type: integer
          minimum: 1
          description: Ціна в копійках (ціле число)
        status:
          type: string
          enum: [active, archived]
        seller_id:
          type: string
    Listing:
      type: object
      required: [id, title, price_cents, status, seller_id, quantity]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        price_cents:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, archived]
        seller_id:
          type: string
        quantity:
          type: integer
          minimum: 0
    CreateListingRequest:
      type: object
      required: [title, price_cents, quantity]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        price_cents:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
    UpdateListingRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        price_cents:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [active, archived]
    ListingListResponse:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListingPublic'
        next_cursor:
          type: string
          nullable: true
          description: Непрозорий токен наступної сторінки; null — сторінок більше немає
    OrderItem:
      type: object
      required: [listing_id, quantity, price_cents]
      additionalProperties: false
      properties:
        listing_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        price_cents:
          type: integer
          minimum: 1
    Order:
      type: object
      required: [id, buyer_id, seller_id, items, total_cents, status]
      additionalProperties: false
      properties:
        id:
          type: string
        buyer_id:
          type: string
        seller_id:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          type: integer
          minimum: 1
          description: Сума в копійках (ціле число)
        status:
          type: string
          enum: [created, paid, cancelled]
    CreateOrderRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [listing_id, quantity]
            additionalProperties: false
            properties:
              listing_id:
                type: string
                minLength: 1
              quantity:
                type: integer
                minimum: 1
    OrderListResponse:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: Непрозорий токен наступної сторінки; null — сторінок більше немає
    ProductCard:
      type: object
      required: [id, name, stock, price_cents, rating, order_lines]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        stock:
          type: integer
          minimum: 0
        price_cents:
          type: integer
          minimum: 0
          description: Ціна в копійках (ціле число)
        rating:
          type: number
          description: Середня кількість одиниць у рядку замовлення
        order_lines:
          type: integer
          minimum: 0
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 256
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: ES256 JWT, живе expires_in секунд
        refresh_token:
          type: string
          description: Непрозорий одноразовий рядок; у БД лежить лише його HMAC
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
    Me:
      type: object
      required: [id, email, role]
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [buyer, seller, admin]
    CreateProductRequest:
      type: object
      required: [name, price_cents, stock]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price_cents:
          type: integer
          minimum: 1
        stock:
          type: integer
          minimum: 0
    Product:
      type: object
      required: [id, name, description, price_cents, stock, seller_id]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price_cents:
          type: integer
          minimum: 1
        stock:
          type: integer
          minimum: 0
        seller_id:
          type: string
    Session:
      type: object
      required: [session_id, expires_in]
      additionalProperties: false
      properties:
        session_id:
          type: string
        expires_in:
          type: integer
          description: TTL сесії в секундах
    CurrentSession:
      type: object
      required: [user_id, expires_in]
      additionalProperties: false
      properties:
        user_id:
          type: string
        expires_in:
          type: integer
          description: Скільки секунд лишилось після подовження
    UploadIntentRequest:
      type: object
      required: [filename, content_type, size]
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Імʼя на пристрої клієнта. У ключ обʼєкта не потрапляє.
        content_type:
          type: string
          minLength: 1
          description: MIME-тип з allowlist сервера (image/png, image/jpeg, image/webp, application/pdf, application/gzip)
        size:
          type: integer
          format: int64
          minimum: 1
          description: Очікуваний розмір у байтах; commit звіряє його з HeadObject
    PresignedPart:
      type: object
      required: [part_number, url]
      additionalProperties: false
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        url:
          type: string
    UploadIntent:
      type: object
      required: [id, key, mode, expires_in]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        mode:
          type: string
          enum: [single, multipart]
        expires_in:
          type: integer
          description: Строк життя підписаних URL, секунди
        method:
          type: string
          enum: [PUT]
        url:
          type: string
          description: Лише для mode=single
        headers:
          type: object
          additionalProperties:
            type: string
          description: Заголовки, які покриває підпис і які клієнт мусить надіслати з PUT
        part_size:
          type: integer
          format: int64
        part_count:
          type: integer
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PresignedPart'
    UploadParts:
      type: object
      required: [id, part_size, part_count, uploaded, missing, expires_in]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        part_size:
          type: integer
          format: int64
        part_count:
          type: integer
        uploaded:
          type: array
          items:
            type: integer
        missing:
          type: array
          items:
            $ref: '#/components/schemas/PresignedPart'
        expires_in:
          type: integer
    StoredFile:
      type: object
      required: [id, key, size, status, etag]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        size:
          type: integer
          format: int64
        status:
          type: string
          enum: [COMPLETED]
        etag:
          type: string
